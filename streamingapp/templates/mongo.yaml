apiVersion: v1
kind: Service
metadata: {name: mongo}
spec:
  clusterIP: None
  selector: {app: streamingapp, component: mongo}
  ports: [{name: mongo, port: 27017, targetPort: mongo}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongo}
spec:
  serviceName: mongo
  replicas: {{ .Values.mongo.replicas }}
  selector: {matchLabels: {app: streamingapp, component: mongo}}
  template:
    metadata: {labels: {app: streamingapp, component: mongo}}
    spec:
      containers:
      - name: mongo
        image: {{ .Values.mongo.image | quote }}
        ports: [{name: mongo, containerPort: 27017}]
        readinessProbe: {tcpSocket: {port: mongo}, initialDelaySeconds: 10}
        livenessProbe: {tcpSocket: {port: mongo}, initialDelaySeconds: 30}
        volumeMounts: [{name: mongo-data, mountPath: /data/db}]
  volumeClaimTemplates:
  - metadata: {name: mongo-data}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: {{ .Values.mongo.storageSize }}}}
