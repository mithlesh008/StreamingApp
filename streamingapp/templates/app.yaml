{{- range $name, $cfg := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {app: streamingapp, component: {{ $name }}}
spec:
  replicas: {{ $cfg.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: streamingapp, component: {{ $name }}}}
  template:
    metadata: {labels: {app: streamingapp, component: {{ $name }}}}
    spec:
      imagePullSecrets:
{{- toYaml $.Values.imagePullSecrets | nindent 6 }}
      containers:
      - name: {{ $name }}
        image: "{{ $cfg.image }}:{{ $cfg.tag }}"
        ports: [{name: http, containerPort: {{ $cfg.containerPort }}}]
        env:
        - {name: PORT, value: "{{ $cfg.port }}"}
        envFrom:
        - {configMapRef: {name: {{ $.Release.Name }}-config}}
        - {secretRef: {name: {{ $.Release.Name }}-secret}}
        readinessProbe: {httpGet: {path: {{ $cfg.probePath | quote }}, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
        livenessProbe: {httpGet: {path: {{ $cfg.probePath | quote }}, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $.Release.Name }}-{{ $name }} }
spec:
  type: ClusterIP
  selector: {app: streamingapp, component: {{ $name }}}
  ports: [{name: http, port: {{ $cfg.servicePort }}, targetPort: http}]
---
{{- end }}
